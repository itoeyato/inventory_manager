<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Inventario · Farmacia y tienda</title>
  <meta name="description" content="Inventario de farmacia y tienda: productos, lotes, vencimientos y ventas.">
  <meta name="theme-color" content="#0f766e">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Inventario">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Tema antes de pintar (evita parpadeo).
    (function () {
      var t = localStorage.getItem("inv-theme") || "auto";
      var d = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = d ? "dark" : "light";
    })();
  </script>
</head>
<body>
  <div id="app">
    <div class="screen center"><div class="logo-badge"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg></div></div>
  </div>
  <div id="sheets"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>Esta app necesita JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
